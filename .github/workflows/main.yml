name: Build ReSUKI-SU Kernel with SUSFS (yastonc/sm8750)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

env:
  DEVICE: oneplus13
  DEFCONFIG: oneplus_sm8750_defconfig        # ← 关键：使用 yastonc 的 defconfig
  RAMDISK_PATH: assets/ramdisk-oneplus13.img

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential ccache curl flex \
            git libncurses-dev libssl-dev python3 wget xz-utils pigz rsync

      - name: Setup Rust (for ksud)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source ~/.cargo/env
          rustup target add aarch64-linux-android

      - name: Download AOSP Clang (android14-release)
        run: |
          mkdir -p prebuilts/clang/host/linux-x86
          cd prebuilts/clang/host/linux-x86
          git clone -b android14-release --depth=1 \
            https://mirrors.tuna.tsinghua.edu.cn/git/AOSP/platform/prebuilts/clang/host/linux-x86 clang

      - name: Integrate ReSUKI-SU (with SUSFS support)
        run: |
          # 使用 ReSUKI 官方 KernelSU（含 SUSFS）
          curl -LSs "https://raw.githubusercontent.com/ReSUKI-dev/KernelSU/main/kernel/setup.sh" | bash -

      - name: Enable SUSFS in defconfig
        run: |
          cat >> arch/arm64/configs/${{ env.DEFCONFIG }} <<EOF

# ReSUKI-SU + SUSFS Configuration
CONFIG_KPROBES=y
CONFIG_HAVE_KPROBES=y
CONFIG_KPROBE_EVENTS=y
CONFIG_KSU=y
CONFIG_KSU_SUS=y
CONFIG_KSU_SUSFS=y
CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y
CONFIG_KSU_SUSFS_SUS_KSTAT=n
CONFIG_KSU_MANUAL_HOOK=y
CONFIG_LOCALVERSION_AUTO=n
EOF

      - name: Compile kernel (GKI-compatible)
        run: |
          export PATH=$GITHUB_WORKSPACE/prebuilts/clang/host/linux-x86/clang/bin:$PATH
          export ARCH=arm64
          export CC=clang
          export LD=ld.lld
          export LLVM_IAS=1

          # 使用 defconfig
          make ${{ env.DEFCONFIG }}

          # 编译（启用 Thin LTO 加速）
          make -j$(nproc) LLVM=1 LLVM_IAS=1 LTO=thin 2>&1 | tee build.log

      - name: Verify kernel output
        run: |
          echo "🔍 Checking kernel image..."
          if [ -f arch/arm64/boot/Image.gz-dtb ]; then
            echo "✅ Found Image.gz-dtb"
          elif [ -f arch/arm64/boot/Image.gz ]; then
            echo "⚠️ Found Image.gz (no dtb), may need manual dtb merge"
          else
            echo "❌ No kernel image found!"
            exit 1
          fi

      - name: Pack boot.img (if ramdisk provided)
        run: |
          if [ -f "${{ env.RAMDISK_PATH }}" ]; then
            echo "📦 Packing boot.img with ramdisk..."
            pip3 install mkbootimg

            mkbootimg \
              --kernel arch/arm64/boot/Image.gz-dtb \
              --ramdisk ${{ env.RAMDISK_PATH }} \
              --cmdline "console=ttyMSM0,115200n8 androidboot.hardware=qcom androidboot.memcg=1" \
              --base 0x00000000 \
              --pagesize 4096 \
              --os_version 14 \
              --os_patch_level 2025-04 \
              --output boot-resukisu-${{ env.DEVICE }}.img

            echo "✅ boot-resukisu-${{ env.DEVICE }}.img created!"
          else
            echo "⚠️ Ramdisk not found at ${{ env.RAMDISK_PATH }}, skipping boot.img."
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: resukisu-kernel-${{ env.DEVICE }}
          path: |
            arch/arm64/boot/Image.gz-dtb
            arch/arm64/boot/Image.gz
            boot-resukisu-${{ env.DEVICE }}.img
            build.log
